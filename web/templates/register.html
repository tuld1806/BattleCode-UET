{% extends "base.html" %}

{% block title %}Đăng ký (Register) - Battlecode 9x9{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 40px auto;">
  <div class="card">
    <div class="card-header">
      <h2 class="card-title">Tạo tài khoản mới</h2>
    </div>

    <form id="registerForm" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label class="form-label" for="username">Tên người dùng (Username)</label>
        <input type="text" id="username" name="username" class="form-control" required minlength="3" autocomplete="username" placeholder="Ít nhất 3 ký tự...">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Mật khẩu (Password)</label>
        <input type="password" id="password" name="password" class="form-control" required minlength="6" autocomplete="new-password" placeholder="Ít nhất 6 ký tự...">
      </div>

      <div id="registerError" style="color: #f87171; font-size: 13px; margin-bottom: 12px; display: none;"></div>

      <button type="submit" class="btn btn-primary" style="width: 100%;">Đăng ký</button>
    </form>

    <div style="margin-top: 16px; text-align: center; font-size: 13px; color: var(--muted);">
      Đã có tài khoản? <a href="/login">Đăng nhập tại đây</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  async function handleRegister(e) {
    e.preventDefault();
    const errorEl = document.getElementById('registerError');
    errorEl.style.display = 'none';

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();
      if (!res.ok) {
        errorEl.textContent = data.detail || 'Đăng ký không thành công.';
        errorEl.style.display = 'block';
        return;
      }

      // Auto login after registration
      const loginRes = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      if (loginRes.ok) {
        window.location.href = '/profile';
      } else {
        window.location.href = '/login';
      }
    } catch (err) {
      errorEl.textContent = `Lỗi mạng: ${err.message}`;
      errorEl.style.display = 'block';
    }
  }
</script>
{% endblock %}
